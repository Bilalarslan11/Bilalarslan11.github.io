name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate owner configuration
        env:
          NEXT_PUBLIC_GAMES_OWNER_ID: ${{ vars.NEXT_PUBLIC_GAMES_OWNER_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GAMES_OWNER_ID" ]; then
            echo '::error::Set NEXT_PUBLIC_GAMES_OWNER_ID in repository Settings > Secrets and variables > Actions > Variables.'
            exit 1
          fi
      - name: Build static website
        env:
          NEXT_PUBLIC_GAMES_OWNER_ID: ${{ vars.NEXT_PUBLIC_GAMES_OWNER_ID }}
        run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: zehai.dk
          enable_jekyll: false
